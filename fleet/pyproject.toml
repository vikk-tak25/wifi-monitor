[project]
name = "fleet"
version = "0.1.0"
description = "Central server for a fleet of ESP32 Wi-Fi measurement units"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
fleet = "fleet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleet*"]

[tool.setuptools.package-data]
fleet = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
