<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wi-Fi Fleet</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/vendor/lightweight-charts.standalone.production.js" defer></script>
  <script src="/static/vendor/qrcode-generator-1.4.4.js" defer></script>
  <script src="/static/labels.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/rooms">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 9.5a14 14 0 0 1 19 0"/><path d="M5.8 13a9.2 9.2 0 0 1 12.4 0"/>
        <path d="M9.1 16.4a4.5 4.5 0 0 1 5.8 0"/><circle cx="12" cy="19.6" r="1.3"/>
      </svg>
      <span><strong>Wi-Fi Fleet</strong><small>Signal and stability per room</small></span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#/rooms" data-nav="rooms">Rooms</a>
      <a href="#/floors" data-nav="floors">Floors</a>
      <a href="#/events" data-nav="events">Events</a>
      <a href="#/units" data-nav="units">Units</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="top-actions">
      <div class="segmented small" role="radiogroup" aria-label="Time window" id="window-picker">
        <button type="button" data-window="1h">1 h</button>
        <button type="button" data-window="24h" class="active">24 h</button>
        <button type="button" data-window="7d">7 d</button>
      </div>
      <button type="button" class="btn ghost" id="logout">Log out</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <template id="login-template">
    <section class="login card">
      <svg class="brand-mark large" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 9.5a14 14 0 0 1 19 0"/><path d="M5.8 13a9.2 9.2 0 0 1 12.4 0"/>
        <path d="M9.1 16.4a4.5 4.5 0 0 1 5.8 0"/><circle cx="12" cy="19.6" r="1.3"/>
      </svg>
      <h1>Wi-Fi Fleet</h1>
      <p class="muted">Sign in to see signal strength and stability per room.</p>
      <form id="login-form">
        <label for="password">Admin password</label>
        <input id="password" type="password" autocomplete="current-password" required autofocus>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </section>
  </template>
</body>
</html>
