[project]
name = "wifimon"
version = "0.1.0"
description = "ESP32 Wi-Fi scanner and connection stability monitor with a local web dashboard"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "esptool>=5", "mpremote>=1.24"]

[project.scripts]
wifimon = "wifimon.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wifimon*"]

[tool.setuptools.package-data]
wifimon = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
